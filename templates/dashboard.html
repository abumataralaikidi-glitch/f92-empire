<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القيادة - F-92 الإمبراطورية السيادية</title>
    <style>
        body { background-color: #1a1a1a; color: #00ff66; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .dashboard { border: 2px solid #00ff66; border-radius: 12px; padding: 20px; max-width: 400px; margin: auto; background-color: #262626; box-shadow: 0 0 15px #00ff66; }
        h1 { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .card { background: #333; margin: 15px 0; padding: 15px; border-radius: 8px; border: 1px solid #00ff66; }
        .status { color: #00ff66; font-weight: bold; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>إمبراطورية F-92</h1>
        <p>القائد الأعلى: العراب</p>
        
        <div class="card">
            <h3>حالة النظام</h3>
            <p class="status">متصل وآمن بنسبة 100%</p>
        </div>

        <div class="card">
            <h3>الخزينة السيادية</h3>
            <p style="color: #ffd700; font-size: 20px; font-weight: bold;">$92,000,000</p>
        </div>

        <div class="card">
            <h3>العمليات العسكرية والتحكم</h3>
            <p>جميع الأنظمة والأيقونات تعمل بتناغم تام</p>
        </div>
    </div>
</body>
</html>
